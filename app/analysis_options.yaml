# Static analysis for BuildTrack.
#
# This is a factory-floor application: a silently dropped Future is a work log
# that never saved, and a null that slips through is a build screen that shows
# nothing to the welder standing in front of it. So the rules below are weighted
# towards catching *correctness* problems, not enforcing a house style.
#
#   flutter analyze          # what CI runs (with --no-fatal-infos, see below)
#   dart fix --dry-run       # see what can be fixed automatically
#   dart fix --apply         # apply it
#
# CI runs `flutter analyze --no-fatal-infos`: warnings and errors block the
# build, infos are advisory. The codebase carries a backlog of info-level style
# lints (const constructors, deprecated withOpacity, quoting) that are worth
# fixing in a dedicated pass, but blocking every push on them now would just
# train everyone to stop reading the output. Errors and warnings are where the
# bugs are, so those are fatal.
#
# To silence a rule for one good reason, use `// ignore: rule_name` on the line
# with a comment saying why — not a blanket removal here.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Stop implicit downcasts from `dynamic`. Every Supabase response starts life
    # as dynamic, and an unchecked cast turns a schema change into a runtime
    # crash on a specific screen instead of a compile error. This one paid off
    # immediately — it passed clean, which means the repositories already cast
    # explicitly.
    strict-casts: true
    # strict-inference and strict-raw-types are deliberately OFF. Turning on
    # strict-inference floods the report with ~40 `MaterialPageRoute(...)` hits
    # (the app never writes `MaterialPageRoute<void>`), and strict-raw-types does
    # the same for every `(data as List)` in the repositories. Both bury the real
    # signal under mechanical noise. Each is worth its own focused pass; neither
    # is worth blocking every build today.

  errors:
    # Unambiguous and trivially fixable — these should never reach a review.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    # A dropped Future here means an insert or an RPC that nobody waited for, so
    # the UI reports success and the database never heard about it. Fatal.
    unawaited_futures: warning
    # Using a BuildContext after an await is the classic Flutter crash: the user
    # navigated away while the write was in flight. The codebase already guards
    # with `if (context.mounted)`; this makes the ones that were missed fatal.
    use_build_context_synchronously: warning
    # Advisory, tracked, not blocking.
    todo: info

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # ── Correctness — these catch bugs, not style ────────────────────────────
    always_declare_return_types: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    valid_regexps: true

    # ── Async discipline ─────────────────────────────────────────────────────
    avoid_void_async: true
    unawaited_futures: true
    unnecessary_await_in_return: true

    # ── Null-safety sharpness ────────────────────────────────────────────────
    null_check_on_nullable_type_parameter: true
    unnecessary_null_checks: true
    unnecessary_nullable_for_final_variable_declarations: true

    # ── Low-noise consistency ────────────────────────────────────────────────
    use_super_parameters: true

    # Not included on purpose (info-level, high volume, pure style): they are
    # deferred to a dedicated cleanup pass rather than kept as permanent noise:
    #   prefer_const_constructors, prefer_single_quotes, directives_ordering,
    #   sort_child_properties_last, curly_braces_in_flow_control_structures.
