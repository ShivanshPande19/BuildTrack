# Static analysis for BuildTrack.
#
# This is a factory-floor application: a silently dropped Future is a work log
# that never saved, and a null that slips through is a build screen that shows
# nothing to the welder standing in front of it. So the rules below are weighted
# towards catching *correctness* problems, not enforcing a house style.
#
#   flutter analyze          # what CI runs
#   dart fix --dry-run       # see what can be fixed automatically
#   dart fix --apply         # apply it
#
# To silence a rule for one good reason, use `// ignore: rule_name` on the line
# with a comment saying why — not a blanket removal here.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Stop implicit downcasts from `dynamic`. Every Supabase response starts life
    # as dynamic, and an unchecked cast turns a schema change into a runtime
    # crash on a specific screen instead of a compile error.
    strict-casts: true
    # Refuse to silently infer `dynamic` for a missing type argument.
    strict-inference: true
    # strict-raw-types is deliberately OFF for now. The repositories are full of
    # `(data as List)` against Supabase responses; turning this on floods the
    # output with hundreds of hits and buries everything else. Worth doing as its
    # own pass, once the list is short enough to read.
    strict-raw-types: false

  errors:
    # Unambiguous and trivially fixable — these should never reach a review.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    # A dropped Future here means an insert or an RPC that nobody waited for, so
    # the UI reports success and the database never heard about it. This has to be
    # loud.
    unawaited_futures: warning
    # Using a BuildContext after an await is the classic Flutter crash: the user
    # navigated away while the write was in flight. The codebase already guards
    # with `if (context.mounted)`; this makes the ones that were missed visible.
    use_build_context_synchronously: warning
    # TODO comments are fine in progress, but should not silently become
    # permanent — surfaced, not fatal.
    todo: info

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # ── Correctness ──────────────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    valid_regexps: true

    # ── Async discipline ─────────────────────────────────────────────────────
    avoid_void_async: true
    unawaited_futures: true
    unnecessary_await_in_return: true

    # ── Null safety sharpness ────────────────────────────────────────────────
    # Flags `x != null ? x : y` style checks that a `??` already handles, and
    # comparisons that can never be null — usually a sign the author was unsure
    # what the type actually was.
    null_check_on_nullable_type_parameter: true
    unnecessary_null_checks: true
    unnecessary_nullable_for_final_variable_declarations: true

    # ── Consistency with how this codebase is already written ────────────────
    prefer_single_quotes: true
    prefer_final_locals: true
    directives_ordering: true
    unnecessary_parenthesis: true
    unnecessary_late: true
    use_super_parameters: true
    sort_child_properties_last: true

    # ── Documentation where it earns its keep ────────────────────────────────
    # Not `public_member_api_docs` — that would demand a docstring on every
    # widget field and train everyone to write "the id" above `final String id`.
    # This one only asks that the comments already written are well-formed.
    comment_references: true
