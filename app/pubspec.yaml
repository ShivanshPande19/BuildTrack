name: buildtrack
description: Azimuth BuildTrack — food-truck build management (all roles).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6      # auth + db + storage + realtime
  flutter_riverpod: ^2.5.1      # state management
  go_router: ^14.2.0            # role-based routing
  google_fonts: ^6.2.1          # Plus Jakarta Sans + Space Grotesk
  intl: ^0.19.0
  model_viewer_plus: ^1.9.0     # 3D design preview (.glb via <model-viewer>)
  file_picker: ^8.1.6           # designer picks .glb / preview from device
  image_picker: ^1.2.3          # workshop site photos + client ticket photos (camera/gallery)
  mobile_scanner: ^7.4.0        # scan a part's QR/barcode to install it (Hero #2)
  pdf: ^3.11.1                  # generate the office-level purchase-order document
  printing: ^5.13.3             # preview / print / share the PO PDF

dev_dependencies:
  flutter_test:                 # was missing entirely — no test could compile
    sdk: flutter
  flutter_lints: ^4.0.0         # rules configured in analysis_options.yaml

flutter:
  uses-material-design: true
